name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y xvfb libopengl0 libglx0 libjpeg-turbo8 libuv1t64 libx11-6 libxext6 libwebp7 libicu74 libpng16-16t64
      - run: npm ci
      - run: npx playwright-core install --with-deps chromium
      - run: xvfb-run -a npm test

  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t maplibre-mcp .
      # The command the docs give for CI: the folder with the style is the working directory, and the image is written into it.
      - run: |
          mkdir work
          echo '{"version": 8, "sources": {}, "layers": [{"id": "background", "type": "background", "paint": {"background-color": "#3366cc"}}]}' > work/style.json
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD/work:/work" -w /work maplibre-mcp render style.json --out map.png
          test -s work/map.png

